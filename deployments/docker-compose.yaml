services:
  nginx:
    image: nginx:1.30-alpine
    container_name: chronomedia-gateway

    ports:
      - "80:80"

    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: chronomedia-postgres

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - app-network

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: chronomedia-redis

    ports:
      - "${REDIS_PORT}:6379"

    networks:
      - app-network

    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
