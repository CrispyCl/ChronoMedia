name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci-pkg:
    uses: ./.github/workflows/reusable-go-ci.yaml
    with:
      test_paths: "./services/pkg/jwt/... ./services/pkg/storage/postgres/... ./services/pkg/storage/redis/... ./services/pkg/logger/..."
